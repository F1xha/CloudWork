server:
  port: ${PORT:8080}
  error:
    include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/helpdesk}
    username: sa
    password: ""
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:ev2}
    password: ${RABBIT_PASSWORD:ev2-local-demo}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
app:
  categories-url: ${CATEGORIES_URL:http://localhost:8082}

spring:
  datasource:
    url: jdbc:h2:mem:diagnostico;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/test-tenant/v2.0
app:
  security:
    audience: test-api
  cors:
    allowed-origins: http://localhost:4200

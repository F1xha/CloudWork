name: EV2 RabbitMQ verificación real
on:
  push:
    branches: ["codex/ev2-rabbitmq"]
    paths: ["ev2-rabbitmq/**", ".github/workflows/ev2-rabbitmq.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ev2-rabbitmq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests
        run: mvn -B test
      - name: Start actual RabbitMQ and services
        run: docker compose up -d --build
      - name: Install screenshot runner
        run: |
          python -m pip install playwright python-docx
          python -m playwright install --with-deps chromium
      - name: Verify and capture evidence
        run: python scripts/verify.py
      - name: Collect logs
        if: always()
        run: |
          mkdir -p evidence
          docker compose logs --no-color > evidence/servicios.log
          docker compose ps -a > evidence/contenedores.txt
          cp -r target/surefire-reports evidence/unit-tests || true
      - name: Build report from collected evidence
        if: always()
        run: python scripts/build_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-ev2-rabbitmq
          path: ev2-rabbitmq/evidence
      - name: Stop stack
        if: always()
        run: docker compose down
